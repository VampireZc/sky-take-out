server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  application:
    name: sky-take-out
  #mysql 连接配置（主机/库名/账号/密码见 application-dev.yml）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: ${sky.datasource.driver-class-name}
    url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}
    username: ${sky.datasource.username}
    password: ${sky.datasource.password}
  # JSON 序列化：值为 null 的字段不返回给前端
  jackson:
    default-property-inclusion: non_null

  data:
    redis:
      database: ${sky.redis.database}
      host: ${sky.redis.host:localhost}
      port: ${sky.redis.port:6379}
      password: ${sky.redis.password}



mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥（admin-secret-key 见 application-dev.yml）
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token

    # 小程序（user-secret-key 见 application-dev.yml）
    user-ttl: 7200000
    user-token-name: authentication

  alioss:
    endpoint: ${sky.alioss.endpoint}
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss.access-key-secret}
    bucket-name: ${sky.alioss.bucket-name}

  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}


springdoc:
  packages-to-scan: com.sky.controller

knife4j:
  enable: true

wechat:
  appid: ${sky.wechat.appid}
  secret: ${sky.wechat.secret}
  mchid: ${sky.wechat.mchid}
  mchSerialNo: ${sky.wechat.mch-serial-no}
  privateKeyFilePath: ${sky.wechat.private-key-file-path}
  apiV3Key: ${sky.wechat.api-v3-key}
  weChatPayCertFilePath: ${sky.wechat.we-chat-pay-cert-file-path}
  notifyUrl: ${sky.wechat.notify-url}
  refundNotifyUrl: ${sky.wechat.refund-notify-url}
